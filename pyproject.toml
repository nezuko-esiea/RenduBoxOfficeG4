[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxoffice"
version = "0.1.0"
description = "Recommandation de films et prédiction du succès au box-office (MovieLens, TMDB, IMDb)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy",
    "scipy",
    "scikit-learn==1.9.1",
    "joblib",
    "matplotlib",
    "seaborn",
    "plotly",
    "streamlit",
    "shap",
    "ipykernel",
    "nbformat",
]

[tool.setuptools.packages.find]
where = ["src"]
